[package]
name = "soravo"
version = "0.1.0"
description = "Soravo voice dictation"
authors = ["Soravo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "soravo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
rdev = "0.5"
reqwest = { version = "0.12", features = ["stream"] }
futures = "0.3"

# The Windows input hook is installed here rather than through rdev's
# `listen`, which blocks on a null MSG pointer and loses the hook. winapi is
# already in the tree through rdev, so this adds no new download.
[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3"
features = ["winuser", "minwindef", "libloaderapi", "errhandlingapi", "processthreadsapi", "dpapi", "winbase"]
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
