# Packaging verification for the CrispASR engine.
#
# This workflow builds the Tauri app on Windows and Linux and verifies that
# the CrispASR engine and its runtime dependencies are present in the
# resulting installers. It is separate from the engineering-pack CI
# workflow because it requires a full Rust/Node toolchain.
#
# This workflow is deliberately allowed to be red until Phase 1 (P1-03,
# P1-04, P1-05) makes the bundle layout green. In Phase 0 it exists, runs,
# and reports, with its result recorded as the baseline.

name: Packaging

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engineering-pack:
    name: Validate engineering pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Validate engineering pack
        env:
          PACK_DIR: Soravo_Fresh_Engineering_Pack
        run: |
          set -euo pipefail
          cat > /tmp/validate-pack.mjs <<'PACK_VALIDATOR_EOF'
          import { readdirSync, readFileSync, existsSync } from "node:fs";
          import { join, dirname, resolve } from "node:path";

          const PACK = process.env.PACK_DIR;
          const errors = [];
          const fail = (message) => errors.push(message);

          const REQUIRED = [
            "00_README.md",
            "01_AUTHORITY_AND_SOURCE_OF_TRUTH.md",
            "02_PRODUCT_REQUIREMENTS.md",
            "03_COMMERCIAL_RULES.md",
            "04_TECHNICAL_DESIGN.md",
            "05_IMPLEMENTATION_PLAN.md",
            "06_TASK_BREAKDOWN.md",
            "07_AI_AGENT_OPERATING_RULES.md",
            "08_SKILLS_AND_MCP_POLICY.md",
            "09_GITHUB_CI_POLICY.md",
            "10_SECURITY_BASELINE.md",
            "11_ENVIRONMENT_AND_SECRETS.md",
            "12_TEST_AND_BENCHMARK_PROTOCOL.md",
            "13_RELEASE_RUNBOOK.md",
            "14_FREE_BINARY_HOSTING_OPTIONS.md",
            "15_ADR_INDEX.md",
            "16_PRIVACY_LEGAL_LAUNCH_CHECKLIST.md",
            "17_DEFINITION_OF_DONE.md",
            "18_PROGRESS_AND_HANDOFF.md",
            "19_STATE_AUDIT_PROTOCOL.md",
            "20_SERVICE_LIMITS_AND_MONITORING.md",
            "21_RENAME_AND_MIGRATION_RUNBOOK.md",
            "22_REVERSE_ENGINEERING_AND_PROVENANCE.md",
            "23_SOURCE_AUDIT_NOTES.md",
            "24_AGENT_PROMPT_TEMPLATE.md",
            "25_REFERENCE_LINKS.md",
            "26_MANIFEST.json",
            "27_PRODUCTION_CUTOVER_AND_ROLLBACK.md",
            "28_GIT_WORKTREE_POLICY.md",
            "INDEX.md",
            "SORAVO_DECISION_MEMO_2026-10-22.md",
          ];

          if (!existsSync(PACK)) {
            console.error(`The ${PACK} directory is missing.`);
            process.exit(1);
          }

          const entries = readdirSync(PACK).filter((name) => !name.startsWith("."));
          const present = new Set(entries);

          for (const name of REQUIRED) {
            if (!present.has(name)) fail(`missing required document: ${PACK}/${name}`);
          }

          let manifest = null;
          try {
            manifest = JSON.parse(readFileSync(join(PACK, "26_MANIFEST.json"), "utf8"));
          } catch (error) {
            fail(`${PACK}/26_MANIFEST.json is not valid JSON: ${error.message}`);
          }
          if (manifest) {
            const listed = new Set(manifest.files ?? []);
            for (const name of present) {
              if (!listed.has(name)) fail(`file on disk but absent from the manifest: ${name}`);
            }
            for (const name of listed) {
              if (!present.has(name)) fail(`file listed in the manifest but absent on disk: ${name}`);
            }
            if (!manifest.version) fail("26_MANIFEST.json has no version field");
            if (manifest.decision_memo && !present.has(manifest.decision_memo)) {
              fail(`manifest decision_memo not found on disk: ${manifest.decision_memo}`);
            }
            if (!manifest.decision_memo) fail("26_MANIFEST.json does not record a decision_memo");
            if (!manifest.mandatory_policies) {
              fail("26_MANIFEST.json does not record mandatory_policies");
            }
          }

          for (const name of entries) {
            if (!name.endsWith(".json")) continue;
            try {
              JSON.parse(readFileSync(join(PACK, name), "utf8"));
            } catch (error) {
              fail(`${PACK}/${name} is not valid JSON: ${error.message}`);
            }
          }
          for (const name of ["package.json", "components.json"]) {
            if (!existsSync(name)) continue;
            try {
              JSON.parse(readFileSync(name, "utf8"));
            } catch (error) {
              fail(`${name} is not valid JSON: ${error.message}`);
            }
          }

          const LINKABLE = /\.(md|json|ya?ml|txt|svg|png|ico|css|html)$/i;
          for (const name of entries.filter((n) => n.endsWith(".md"))) {
            const text = readFileSync(join(PACK, name), "utf8");
            for (const match of text.matchAll(/\]\(([^)\s]+)\)/g)) {
              const target = match[1];
              if (/^[a-z][a-z0-9+.-]*:/i.test(target)) continue;
              if (target.startsWith("#")) continue;
              if (target.startsWith("//")) continue;
              const pathPart = target.split("#")[0];
              if (!pathPart) continue;
              if (!LINKABLE.test(pathPart)) continue;
              const resolved = resolve(dirname(join(PACK, name)), pathPart);
              if (!existsSync(resolved)) {
                fail(`${PACK}/${name}: broken link -> ${target}`);
              }
            }
            for (const match of text.matchAll(/`(\d{2}_[A-Z_]+\.md|INDEX\.md|SORAVO_DECISION_MEMO_2026-10-22\.md)`/g)) {
              if (!present.has(match[1])) {
                fail(`${PACK}/${name}: unresolved document reference -> ${match[1]}`);
              }
            }
          }

          for (const name of entries) {
            if (!name.endsWith(".md") && !name.endsWith(".json")) continue;
            if (readFileSync(join(PACK, name)).includes(0x0d)) {
              fail(`${PACK}/${name} contains CR bytes; text files must be stored with LF endings`);
            }
          }

          const SECRET_PATTERNS = [
            /sk_live_[A-Za-z0-9]{10,}/,
            /sk_test_[A-Za-z0-9]{10,}/,
            /whsec_[A-Za-z0-9]{10,}/,
            /rzp_live_[A-Za-z0-9]{10,}/,
            /rzp_test_[A-Za-z0-9]{10,}/,
            /ghp_[A-Za-z0-9]{20,}/,
            /github_pat_[A-Za-z0-9_]{20,}/,
            /AKIA[0-9A-Z]{16}/,
            /-----BEGIN [A-Z ]*PRIVATE KEY-----/,
            /eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}/,
          ];
          for (const name of entries) {
            const text = readFileSync(join(PACK, name), "utf8");
            for (const pattern of SECRET_PATTERNS) {
              if (pattern.test(text)) {
                fail(`${PACK}/${name}: possible credential material matching ${pattern.source}`);
              }
            }
          }

          if (errors.length > 0) {
            console.error("Engineering pack validation FAILED:\n");
            for (const error of errors) console.error(`  - ${error}`);
            process.exit(1);
          }

          console.log(`Engineering pack validation passed: ${entries.length} documents checked.`);
          PACK_VALIDATOR_EOF
          node /tmp/validate-pack.mjs

      - name: Check that the working tree is unchanged by validation
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The validation step modified the working tree:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "Working tree unchanged by validation."

  verify-packaging:
    name: Verify CrispASR packaging (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.90.0

      - name: Cache Rust target
        uses: actions/cache/restore@v4
        with:
          key: rust-target-windows-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          path: |
            src-tauri/target/
            ~/.cargo/registry
            ~/.cargo/git

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Verify bundle configuration
        run: node scripts/verify-packaging.mjs

      - name: Verify bundle contents (MSI)
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI installer found" }
          $extractDir = "$env:TEMP\msi_extract"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extractDir`"" -Wait
          node scripts/verify-packaging.mjs --bundle "$extractDir\PFiles\Soravo"

  verify-linux-packaging:
    name: Verify CrispASR packaging (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.90.0

      - name: Cache Rust target
        uses: actions/cache/restore@v4
        with:
          key: rust-target-linux-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          path: |
            src-tauri/target/
            ~/.cargo/registry
            ~/.cargo/git

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            fuse

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Linux AppImage)
        run: npm run tauri:build

      - name: Verify bundle configuration
        run: node scripts/verify-packaging.mjs

      - name: Verify bundle contents (AppImage)
        shell: bash
        run: |
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          if [ -z "$appimage" ]; then echo "No AppImage found"; exit 1; fi
          appimage=$(readlink -f "$appimage")
          extractDir="$HOME/appimage_extract"
          rm -rf "$extractDir"
          mkdir -p "$extractDir"
          cd "$extractDir"
          "$appimage" --appimage-extract >/dev/null 2>&1 || true
          appDir=$(find squashfs-root -type d -name "crispasr-linux" 2>/dev/null | head -1 | xargs dirname)
          if [ -z "$appDir" ]; then
            echo "Could not locate app directory in extracted AppImage"
            exit 1
          fi
          node /github/workspace/scripts/verify-packaging.mjs --bundle "$appDir"
